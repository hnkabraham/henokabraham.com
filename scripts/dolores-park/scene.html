<!doctype html>
<meta charset="utf-8" />
<script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }

<body style="margin:0;background:#000">
<script type="module">
  // Dolores Park, built from public data: the USGS 1 m terrain draped with
  // NAIP imagery, DataSF LiDAR building footprints (OSM where DataSF has a
  // gap), the city's street-tree list (its Canary Island date palms on the
  // Dolores median), canopies read off the NAIP photo, and the city between
  // the park and downtown. The GT350 is parked on 20th Street at the top of
  // the park. World: X east, Y up (metres above NAVD88), Z south (-north).
  // Offline only; reference frames are never loaded or used as textures.
  // Params documented in scripts/dolores-park/README.md. preset=streetview|west|victorians uses a
  // horizontal fov (60 degrees), heading/pitch in degrees, cam=x,y in local m.
  // Legacy camera/look and vertical fov are retained when preset is omitted.
  import * as T from 'three';
  import { distantTraffic } from './traffic.js';
  import { buildHouses, houseTreeXs, garageCutPositions } from './houses.js';
  import { buildPalms } from './palms.js';
  import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
  import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
  import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
  import { heroTree, groundGrowth, rustyTree } from './detail.js';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
  import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
  import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

  const q = new URLSearchParams(location.search);
  const num = (k, d) => (q.has(k) ? Number(q.get(k)) : d);
  const vec = (k, d) => (q.get(k) || d).split(',').map(Number);
  const preset = q.get('preset');
  const victorians = preset === 'victorians';
  const survey = preset === 'streetview' || preset === 'west' || victorians;
  // Artistic summer evening: light from WNW reaches the north-facing fronts.
  if (victorians) for (const [key, value] of Object.entries({
    cam: '7.6,-148.5', camH: 1.4, look: '19.6,-162,2.7', fov: 59,
    sunAz: 290, sunEl: 10, sun: 5, exposure: 1.05, env: .65, hemi: .55,
    sunColor: '#ffe2b7', traffic: 0, heroTree: 0, benches: 0,
    grassBlades: 26000, grassHeight: .35,
  })) if (!q.has(key)) q.set(key, String(value));
  if(preset==='west')for(const [key,value] of Object.entries({
    sunAz:290,sunEl:10,sun:5,exposure:1.05,env:.65,hemi:.55,sunColor:'#ffe2b7',
  }))if(!q.has(key))q.set(key,String(value));
  const W = num('w', victorians ? 1920 : 1600), H = num('h', victorians ? 1200 : survey ? 1360 : 1000);
  const grey = q.get('grey') === '1';
  const BASE = '/archive/scenery/dolores/';
  const rad = (d) => (d * Math.PI) / 180;
  const V = (x, y, z) => new T.Vector3(x, z, -y); // local (x east, y north, z up)

  // A small deterministic hash for per-object variation.
  const hash = (a, b) => {
    const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
    return s - Math.floor(s);
  };

  function canvasTexture(w, h, draw, opts = {}) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new T.CanvasTexture(c);
    t.colorSpace = opts.data ? T.NoColorSpace : T.SRGBColorSpace;
    t.wrapS = t.wrapT = T.RepeatWrapping;
    t.anisotropy = 8;
    return t;
  }

  async function main() {
    const assetErrors=[];
    const manager=new T.LoadingManager();
    let managerPending=0;
    const itemStart=manager.itemStart.bind(manager), itemEnd=manager.itemEnd.bind(manager);
    manager.itemStart=url=>{managerPending++;itemStart(url);};
    manager.itemEnd=url=>{managerPending--;itemEnd(url);};
    manager.onError=url=>assetErrors.push(url);
    const r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: false });
    r.setPixelRatio(1);
    r.setSize(W, H, false);
    r.outputColorSpace = T.SRGBColorSpace;
    r.toneMapping = T.ACESFilmicToneMapping;
    r.toneMappingExposure = num('exposure', 1.2);
    r.shadowMap.enabled = true;
    r.shadowMap.type = T.PCFShadowMap;
    document.body.appendChild(r.domElement);
    const scene = new T.Scene();
    const windowMaterials=[]; let carHolder; const carMaterials=new Set();

    const meta = await (await fetch(BASE + 'scene.json')).json();
    // Reference-informed roofline override for the shallow survey mass behind the camera.
    // The source bundle remains unmodified; this is an artistic massing correction.
    for(const b of meta.buildings){const x=b.p.reduce((a,p)=>a+p[0],0)/b.p.length,y=b.p.reduce((a,p)=>a+p[1],0)/b.p.length;
      if(x>0&&x<5&&y>-190&&y<-175)b.h+=num('nearRoofLift',3.0);
    }
    const grid = new Float32Array(await (await fetch(BASE + 'terrain.f32')).arrayBuffer());
    const tm = meta.terrain;
    const heightAt = (x, y) => {
      const c = ((x - tm.x0) / (tm.x1 - tm.x0)) * tm.w - 0.5;
      const rr = ((tm.y1 - y) / (tm.y1 - tm.y0)) * tm.h - 0.5;
      const c0 = Math.max(0, Math.min(tm.w - 2, Math.floor(c))), r0 = Math.max(0, Math.min(tm.h - 2, Math.floor(rr)));
      const fc = Math.min(1, Math.max(0, c - c0)), fr = Math.min(1, Math.max(0, rr - r0));
      const g = (a, b) => grid[(r0 + b) * tm.w + c0 + a];
      return (g(0, 0) * (1 - fc) + g(1, 0) * fc) * (1 - fr) + (g(0, 1) * (1 - fc) + g(1, 1) * fc) * fr;
    };

    // The strip and every object touching it share this exact sampled surface.
    const road = meta.roads.filter(rd => rd.n === '20th Street').flatMap(rd => rd.p)
      .sort((a, b) => a[0] - b[0]);
    if (!road.length) throw new Error('Missing 20th Street centreline');
    const roadY = x => {
      for (let i = 0; i < road.length - 1; i++) {
        const [ax, ay] = road[i], [bx, by] = road[i + 1];
        if (bx > ax && x >= ax && x <= bx) return ay + (x - ax) / (bx - ax) * (by - ay);
      }
      return x < road[0][0] ? road[0][1] : road.at(-1)[1];
    };
    const roadLift = num('roadLift', 0.06);
    // Linear interpolation at the strip's 1 m vertices avoids DEM/mesh mismatch.
    const roadHeight = x => {
      const a = Math.floor(x), f = x - a;
      return T.MathUtils.lerp(heightAt(a, roadY(a)), heightAt(a + 1, roadY(a + 1)), f) + roadLift;
    };
    const edgeHeight = x => roadHeight(x) + 0.10;
    const isCloseHouse=b=>{
      const cx=b.p.reduce((s,p)=>s+p[0],0)/b.p.length,north=Math.max(...b.p.map(p=>p[1]));
      return cx>-100&&cx<100&&Math.abs(north-(roadY(cx)-9))<4&&b.h>5;
    };
    const driveways=garageCutPositions(meta.buildings.filter(isCloseHouse),roadY);
    const curbDrop=x=>.075*Math.max(...driveways.map(c=>1-T.MathUtils.smoothstep(Math.abs(x-c),1.05,2.05)));
    const car = { x: num('carX', 13.3), y: num('carY', -154.63) };
    const roadZ = roadHeight(car.x);
    const surfaceAt = (x, y) => {
      if(x < -125 || x > 90)return heightAt(x,y);
      const off=y-roadY(x),pathEnd=num('pathOff',8.6)+num('pathWidth',1.8);
      if(Math.abs(off)<=5.5)return roadHeight(x);
      if(off>5.5&&off<=pathEnd)return edgeHeight(x);
      if(off>pathEnd&&off<=pathEnd+3)return T.MathUtils.lerp(edgeHeight(x),heightAt(x,roadY(x)+pathEnd+3),(off-pathEnd)/3);
      if(off>=-8.6&&off< -5.5)return edgeHeight(x)-curbDrop(x)*Math.max(0,1-(-off-5.5)/2.7);
      return heightAt(x,y);
    };
    const rng = (seed => () => { seed = (1664525 * seed + 1013904223) >>> 0; return seed / 4294967296; })(num('seed', 7));
    function box(parent, x, y, z, w, h, d, mat) {
      const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat);
      m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
    }
    // ---- Sky: a CC0 golden-hour HDRI, turned so its sun sits at sunAz.
    const sunAz = num('sunAz', 225), sunEl = num('sunEl', 28);
    const hdr = new HDRLoader().parse(await (await fetch('/archive/scenery/dolores/assets/' + (q.get('sky') || 'kloppenheim_06_puresky_4k') + '.hdr')).arrayBuffer());
    const sky = new T.DataTexture(hdr.data, hdr.width, hdr.height, T.RGBAFormat, hdr.type);
    sky.mapping = T.EquirectangularReflectionMapping;
    sky.flipY = true;
    sky.colorSpace = T.LinearSRGBColorSpace;
    sky.magFilter = sky.minFilter = T.LinearFilter;
    sky.needsUpdate = true;
    // Find the HDRI's own sun (its brightest texel) to rotate it into place.
    let best = 0, bi = 0;
    const px = hdr.data, stride = 4;
    const toF = hdr.type === T.HalfFloatType ? (v) => T.DataUtils.fromHalfFloat(v) : (v) => v;
    for (let i = 0; i < px.length; i += stride * 7) {
      const l = toF(px[i]) + toF(px[i + 1]) + toF(px[i + 2]);
      if (l > best) { best = l; bi = i / stride; }
    }
    const su = ((bi % hdr.width) + 0.5) / hdr.width;
    // three's equirect lookup: u = atan(dir.z, dir.x) / 2pi + 0.5.
    const hdrAngle = (su - 0.5) * 2 * Math.PI;
    const toSun = new T.Vector3(Math.sin(rad(sunAz)) * Math.cos(rad(sunEl)), Math.sin(rad(sunEl)), -Math.cos(rad(sunAz)) * Math.cos(rad(sunEl)));
    const sv = (Math.floor(bi / hdr.width) + 0.5) / hdr.height;
    const hdrEl = (0.5 - sv) * Math.PI;
    const sourceSun = new T.Vector3(Math.cos(hdrAngle) * Math.cos(hdrEl), Math.sin(hdrEl), Math.sin(hdrAngle) * Math.cos(hdrEl));
    // Scene rotation moves the source sun into place; Three transposes it for lookup.
    const skyQuat = new T.Quaternion().setFromUnitVectors(sourceSun, toSun);
    const envRot = new T.Euler().setFromQuaternion(skyQuat);
    envRot.y += rad(num('skyTurn', 0));
    const pmrem = new T.PMREMGenerator(r);
    scene.environment = pmrem.fromEquirectangular(sky).texture;
    scene.environmentRotation = envRot;
    scene.background = sky;
    function skyLinear(hex){
      const desired=new T.Color(hex);
      if(!num('ao',1))return desired;
      const input=new T.Matrix3().set(.59719,.35458,.04823,.076,.90834,.01566,.0284,.13383,.83777);
      const output=new T.Matrix3().set(1.60475,-.53108,-.07367,-.10208,1.10813,-.00605,-.00327,-.07276,1.07602);
      const v=new T.Vector3(desired.r,desired.g,desired.b).applyMatrix3(output.invert());
      const inv=y=>{const a=.983729*y-1,b=.432951*y-.0245786,c=.238081*y+.000090537;return(-b-Math.sqrt(b*b-4*a*c))/(2*a);};
      v.set(inv(v.x),inv(v.y),inv(v.z)).applyMatrix3(input.invert()).multiplyScalar(.6/r.toneMappingExposure);
      return new T.Color(v.x,v.y,v.z);
    }
    // A pale winter sky for the reference view; CC0 HDRI still lights paint.
    // skyMode=hdri exposes the original photographic sky for comparison.
    if (q.get('skyMode') !== 'hdri') {
      const skyDome = new T.Mesh(new T.SphereGeometry(18000, 48, 24), new T.ShaderMaterial({
        side: T.BackSide, depthWrite: false, toneMapped: false,
        uniforms: { zenith: { value: skyLinear('#78b5f2') }, horizon: { value: skyLinear(q.get('haze') || '#f1f7fc') } },
        vertexShader: 'varying vec3 dir; void main(){ dir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
        fragmentShader: `uniform vec3 zenith; uniform vec3 horizon; varying vec3 dir;
          void main(){ float h=max(normalize(dir).y,0.0); gl_FragColor=vec4(mix(horizon,zenith,min(1.0,smoothstep(0.0,0.13,h)*.83+h*.25)),1.0);

          #include <colorspace_fragment>
          }`,
      }));
      skyDome.renderOrder = -1000; // draw before the farther ridge; never write sky depth
      scene.add(skyDome);
    }
    scene.backgroundRotation = envRot;
    scene.backgroundIntensity = num('skyGain', 1.0);
    scene.environmentIntensity = num('env', 0.45);
    const haze = new T.Color(q.get('haze') || '#e4f3fb');
    scene.fog = new T.FogExp2(haze, num('fog', 0.00009));

    const sun = new T.DirectionalLight(new T.Color(q.get('sunColor') || '#fff0d8'), num('sun', 6.0));
    const carPos = V(car.x, car.y, roadZ);
    sun.position.copy(carPos).addScaledVector(toSun, 400);
    sun.target.position.copy(carPos);
    scene.add(sun.target);
    sun.castShadow = true;
    const sr = num('shadowR', 70);
    Object.assign(sun.shadow.camera, { left: -sr, right: sr, top: sr, bottom: -sr, near: 200, far: 700 });
    sun.shadow.mapSize.set(8192, 8192);
    sun.shadow.bias = -0.0001;
    sun.shadow.normalBias = 0.04;
    sun.shadow.radius = 1;
    scene.add(sun);
    scene.add(new T.HemisphereLight(0xbcd2ee, 0x5a5048, num('hemi', 0.32)));

    const tex = new T.TextureLoader(manager);
    const load = (u, srgb = true) => {
      const t = tex.load(u);
      t.wrapS = t.wrapT = T.RepeatWrapping;
      t.anisotropy = 16;
      if (srgb) t.colorSpace = T.SRGBColorSpace;
      return t;
    };
    const naip = load(BASE + 'naip.jpg');
    naip.wrapS = naip.wrapT = T.ClampToEdgeWrapping;
    const NX0 = -650, NY0 = -450, NSPAN = 1400;

    // ---- Terrain.
    {
      const { w, h, x0, x1, y0, y1 } = tm;
      const pos = new Float32Array(w * h * 3), uv = new Float32Array(w * h * 2);
      for (let rr = 0; rr < h; rr++)
        for (let c = 0; c < w; c++) {
          const i = rr * w + c;
          const x = x0 + ((c + 0.5) / w) * (x1 - x0), y = y1 - ((rr + 0.5) / h) * (y1 - y0);
          const offset = y - roadY(x);
          const onStrip = x >= -125 && x <= 90 && offset >= -8.6 && offset <= num('pathOff',8.6) + num('pathWidth',1.8);
          const top = Math.abs(offset) <= 5.5 ? roadHeight(x) : edgeHeight(x);
          pos.set([x, onStrip ? Math.min(grid[i],top-0.035) : grid[i], -y], i * 3);
          uv.set([(x - NX0) / NSPAN, (y - NY0) / NSPAN], i * 2);
        }
      const idx = new Uint32Array((w - 1) * (h - 1) * 6);
      let k = 0;
      for (let rr = 0; rr < h - 1; rr++)
        for (let c = 0; c < w - 1; c++) {
          const a = rr * w + c, b = a + 1, cc = a + w, d = cc + 1;
          idx.set([a, cc, b, b, cc, d], k);
          k += 6;
        }
      const g = new T.BufferGeometry();
      g.setAttribute('position', new T.BufferAttribute(pos, 3));
      g.setAttribute('uv', new T.BufferAttribute(uv, 2));
      g.setIndex(new T.BufferAttribute(idx, 1));
      g.computeVertexNormals();
      const detail = load(BASE+'assets/grass_ground_diff_1k.jpg');
      const m = new T.MeshStandardMaterial({ map: naip, roughness: 1 });
      m.onBeforeCompile = (s) => {
        s.uniforms.detail = { value: detail };
        s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vW;').replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvW = (modelMatrix * vec4(transformed, 1.0)).xyz;');
        s.fragmentShader = s.fragmentShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vW;\nuniform sampler2D detail;')
          .replace('#include <map_fragment>', `#include <map_fragment>
            // NAIP runs cool and flat: warm and saturate it, then add ground
            // detail that fades out with distance.
            float lumN = dot(diffuseColor.rgb, vec3(0.299, 0.587, 0.114));
            diffuseColor.rgb = max(mix(vec3(lumN), diffuseColor.rgb, 1.45) * vec3(1.06, 1.02, 0.86), 0.0);
            float dd = length(vW - cameraPosition);
            float fade = 1.0 - smoothstep(15.0, 160.0, dd);
            vec3 det = texture2D(detail, vW.xz / 4.0).rgb;
            diffuseColor.rgb *= mix(1.0, dot(det, vec3(0.333)) * 2.2, 0.55 * fade);
            float park = step(-110.0,vW.x)*step(vW.x,135.0)*step(-130.0,-vW.z)*step(-vW.z,125.0);
            float green = smoothstep(0.008,0.05,diffuseColor.g-diffuseColor.r*.85);
            float patchiness = .5+.25*sin(vW.x*.27+sin(vW.z*.13))+.25*sin(vW.z*.39+vW.x*.12);
            vec3 turf = det * mix(vec3(.50,1.45,.19),vec3(1.6,1.9,.67),smoothstep(.4,.9,patchiness));
            turf*=.92+.08*sin(vW.x*1.25+vW.z*.6);
            diffuseColor.rgb = mix(diffuseColor.rgb,turf,park*green*.88);`);
      };
      const terrain = new T.Mesh(g, m);
      terrain.receiveShadow = true;
      scene.add(terrain);
      // Beyond the 1 m DEM: the Mission flats, lost in haze.
      const far = new T.Mesh(new T.PlaneGeometry(12000, 12000), new T.MeshStandardMaterial({ color: 0xa4b2b5, roughness: 1 }));
      far.rotation.x = -Math.PI / 2;
      far.position.set(1500, 3, -2500);
      scene.add(far);
    }

    // ---- 20th Street at the car: asphalt, curbs and sidewalks over the DEM.
    {
      const strip = (yOff0, yOff1, lift, mat, x0 = -125, x1 = 90, step = 1) => {
        const pos = [], uv = [], idx = [];
        let n = 0;
        const samples=[];
        for(let x=x0;x<x1-.0001;x+=step)samples.push(x);
        samples.push(x1);
        for (const x of samples) {
          const c = roadY(x);
          for (const off of [yOff0, yOff1]) {
            const y = c + off;
            pos.push(x, roadHeight(x) - roadLift + lift-(off<=-5.5?curbDrop(x)*Math.max(0,1-(-off-5.5)/2.7):0), -y);
            uv.push(x / 3, y / 3);
          }
          if (x > x0) idx.push(n - 2, n, n - 1, n - 1, n, n + 1);
          n += 2;
        }
        const g = new T.BufferGeometry();
        g.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
        g.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
        g.setIndex(idx);
        g.computeVertexNormals();
        const mesh = new T.Mesh(g, mat);
        mesh.receiveShadow = true;
        scene.add(mesh);
        return mesh;
      };
      const asphalt = new T.MeshStandardMaterial({
        map: load('/archive/scenery/dolores/assets/asphalt_02_diff_1k.jpg'), normalMap: load('/archive/scenery/dolores/assets/asphalt_02_nor_gl_1k.jpg', false),
        roughnessMap: load('/archive/scenery/dolores/assets/asphalt_02_rough_1k.jpg', false), color: 0xf0eade, polygonOffset: true, polygonOffsetFactor: -4,
      });
      const concrete = new T.MeshStandardMaterial({
        map: load('/archive/scenery/dolores/assets/concrete_floor_worn_001_diff_1k.jpg'), normalMap: load('/archive/scenery/dolores/assets/concrete_floor_worn_001_nor_gl_1k.jpg', false),
        roughnessMap: load('/archive/scenery/dolores/assets/concrete_floor_worn_001_rough_1k.jpg', false), color: 0xfff7e7, polygonOffset: true, polygonOffsetFactor: -4,
      });
      concrete.color.setRGB(1.7,1.67,1.56);
      concrete.normalScale.set(.22,.22);
      asphalt.normalScale.set(.16,.16);
      const curbM = new T.MeshStandardMaterial({ map:load('/archive/scenery/dolores/assets/concrete_floor_worn_001_diff_1k.jpg'),color:new T.Color(1.4,1.37,1.29),roughness:1 });
      asphalt.onBeforeCompile=s=>{
        s.vertexShader=s.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 roadWorld;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nroadWorld=(modelMatrix*vec4(transformed,1.)).xyz;');
        s.fragmentShader=s.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 roadWorld;').replace('#include <map_fragment>',`#include <map_fragment>
          float a=dot(diffuseColor.rgb,vec3(.333));
          float roadPatch=sin(roadWorld.x*.68+sin(roadWorld.z*1.7))*sin(roadWorld.z*.49+sin(roadWorld.x*1.1));
          float curbDist=abs(-roadWorld.z-(-159.9724+roadWorld.x*.07615));
          float oil=smoothstep(2.6,4.6,curbDist)*(0.5+0.5*sin(roadWorld.x*.87+sin(roadWorld.z*3.7)));
          diffuseColor.rgb=vec3(.085+a*.72)*(1.+roadPatch*.11-oil*.21);`);
      };
      strip(-5.5, 5.5, roadLift, asphalt);
      // Preserve vegetation's established random sequence (the old unused
      // dirt texture consumed 7,000 marks × four values).
      for(let i=0;i<28000;i++)rng();
      const pathOff = num('pathOff', 8.6), pathWidth = num('pathWidth', 1.8);
      strip(5.5, 5.7, roadLift + 0.10, curbM);
      const earthMat=new T.MeshStandardMaterial({map:load(BASE+'assets/brown_mud_leaves_01_diff_1k.jpg'),normalMap:load(BASE+'assets/brown_mud_leaves_01_nor_gl_1k.jpg',false),color:new T.Color(1.25,1.1,.86),roughness:1});
      strip(5.7, pathOff, roadLift + 0.10, earthMat);
      strip(pathOff, pathOff + pathWidth, roadLift + 0.10, concrete);
      strip(-8.6, -7.3, roadLift + 0.10, concrete);
      strip(-5.8, -5.5, roadLift + 0.10, concrete);
      let pavementStart=-125;
      for(const x of houseTreeXs){
        strip(-7.3,-5.8,roadLift+.10,concrete,pavementStart,x-.65);
        pavementStart=x+.65;
      }
      strip(-7.3,-5.8,roadLift+.10,concrete,pavementStart,90);
      // Short transition back to the falling DEM, preventing an exposed path edge.
      const pp = [], ii = [];
      for (let x = -125; x <= 90; x++) {
        const y = roadY(x) + pathOff + pathWidth;
        pp.push(x, edgeHeight(x), -y, x, heightAt(x, y + 3) + 0.03, -(y + 3));

        ? new T.MeshStandardMaterial({ color: 0x6e8049, roughness: 1 })

      const trunk = new T.InstancedMesh(new T.CylinderGeometry(0.12, 0.18, 1, 7).translate(0, 0.5, 0), new T.MeshStandardMaterial({ color: 0x726a59, roughness: 1 }), trees.length);
      const m4 = new T.Matrix4(), c = new T.Color();
      // Four independently generated crown shapes and per-tree aspect ratios.
      for (let variant = 0; variant < 4; variant++) {
        const subset = trees.map((t,i) => ({t,i})).filter(({i}) => i % 4 === variant);
        const geo = grey ? new T.IcosahedronGeometry(0.9, 1) : canopyGeometry(145 + variant * 31);
        const inst = new T.InstancedMesh(geo, mat, subset.length);
        subset.forEach(({t,i},j) => {
          const rr = (t.k === 'canopy' ? t.d : Math.min(5.5, 1.4 + t.d * 0.13)) * num('treeScale', 1);
          const hgt = rr * (1.9 + hash(t.x,t.y) * 1.1);
          const aspect = 0.65 + hash(t.y, 33) * 0.6;
          m4.compose(V(t.x,t.y,t.z+hgt-rr*0.8), new T.Quaternion().setFromEuler(new T.Euler(0,hash(t.y,t.x)*6.28,0)), new T.Vector3(rr,rr*aspect,rr*(0.7+hash(t.x,22)*0.5)));
          inst.setMatrixAt(j,m4);
          c.setHSL(0.19+hash(t.x,1)*0.10,0.34+hash(2,t.y)*0.3,0.47+hash(t.y,3)*0.38);
          inst.setColorAt(j,c);
          m4.compose(V(t.x,t.y,t.z-0.2),new T.Quaternion(),new T.Vector3(rr*0.65,hgt-rr*0.9,rr*0.65));
          trunk.setMatrixAt(i,m4);
        });
        inst.castShadow = inst.receiveShadow = true; scene.add(inst);
      }
      trunk.castShadow = true; scene.add(trunk);
    }

    // ---- Sculpted tree with parent/child branching and individually folded leaves.
    if(num('heroTree',1))heroTree({scene,load,V,edgeHeight,num,rng,toSun});
    if(num('conifer',0))rustyTree({scene,V,heightAt,rng,num});

    buildPalms({scene,treeData,V,load,num,hash,canvasTexture,rng,toSun});

    const trafficMaterials=num('traffic',1)?await distantTraffic({scene,manager,roadY,roadHeight,V}):[];

    // ---- The GT350.
    {
      const draco = new DRACOLoader(manager).setDecoderPath('/public/draco/');
      const gltf = await new GLTFLoader(manager).setDRACOLoader(draco).loadAsync(q.get('glb') || '/public/models/garage-gt350r.glb');
      gltf.scene.traverse((node) => {
        if (!node.isMesh) return;
        node.castShadow = node.receiveShadow = true;
        const original = node.material;
        if (!original.name?.toLowerCase().includes('paint')) return;
        const finish = new T.MeshPhysicalMaterial();
        T.MeshStandardMaterial.prototype.copy.call(finish, original);
        finish.defines = { STANDARD: '', PHYSICAL: '' };
        finish.roughness = 0.45;
        finish.metalness = 0.1;
        finish.clearcoat = 0.35;
        finish.clearcoatRoughness = 0.25;
        node.material = finish;
      });
      const holder = new T.Group();
      // Facing west, nose up the hill: pitch from the road's own slope.
      const wheel = 1.36;
      const zf = roadHeight(car.x - wheel), zr = roadHeight(car.x + wheel);
      const pitch = Math.atan2(zf - zr, wheel * 2);
      holder.position.copy(V(car.x, car.y, (zf + zr) / 2 + .0215));
      holder.rotation.order = 'YXZ';
      holder.rotation.set(-pitch, -Math.PI / 2, 0);
      holder.add(gltf.scene);
      scene.add(holder);holder.userData.carRoot=gltf.scene;carHolder=holder;holder.traverse(o=>{if(o.isMesh)for(const m of(Array.isArray(o.material)?o.material:[o.material]))carMaterials.add(m);});
      // contact shadow
      const blob = canvasTexture(128, 128, (g, w, h) => {
        const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
        gr.addColorStop(0, 'rgba(0,0,0,0.85)'); gr.addColorStop(0.6, 'rgba(0,0,0,0.5)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
      });
      const ao = new T.Mesh(new T.PlaneGeometry(2.3, 5.0), new T.MeshBasicMaterial({ map: blob, transparent: true, depthWrite: false, opacity: 0.8 }));
      ao.rotation.x = -Math.PI / 2;
      ao.position.y = -0.0015;
      holder.add(ao);
      for(const xx of[-.82,.82])for(const zz of[-1.36,1.36]){
        const contact=new T.Mesh(new T.PlaneGeometry(.52,.76),new T.MeshBasicMaterial({map:blob,transparent:true,depthWrite:false,opacity:.7}));contact.rotation.x=-Math.PI/2;contact.position.set(xx,.0025,zz);holder.add(contact);
      }
    }

    // ---- Camera.
    const [cx, cy] = vec('cam', survey ? (preset==='streetview'?'8.4,-162.35':'7.6,-159.5') : '-61,-171');
    const camZ = surfaceAt(cx, cy) + num('camH', survey ? (preset==='streetview'?2.85:2.5) : 1.6);
    const fov = num('fov', survey ? (preset==='streetview'?65:60) : 26);
    const vfov = survey ? T.MathUtils.radToDeg(2 * Math.atan(Math.tan(rad(fov) / 2) / (W / H))) : fov;
    const camera = new T.PerspectiveCamera(vfov, W / H, 0.15, 40000);
    camera.position.copy(V(cx, cy, camZ));
    if (survey && !q.has('look')) {
      const heading = rad(num('heading', preset === 'west' ? 95 : 28.2)), pitch = rad(num('pitch', preset==='streetview'?-3.5:-5.6));
      camera.lookAt(camera.position.clone().add(new T.Vector3(Math.sin(heading) * Math.cos(pitch), Math.sin(pitch), -Math.cos(heading) * Math.cos(pitch))));
    } else {
      const [lx, ly, lz] = vec('look', '-20,-120,0.6');
      camera.lookAt(V(lx, ly, roadZ + lz));
    }
    const geometryStats={meshNodes:0,instanceCount:0,submittedTriangles:0};
    scene.traverse(o=>{if(o.isMesh){geometryStats.meshNodes++;const n=o.isInstancedMesh?o.count:1;geometryStats.instanceCount+=n;geometryStats.submittedTriangles+=((o.geometry.index?.count||o.geometry.attributes.position.count)/3)*n;}});
    camera.updateMatrixWorld();
    const anchors=[['Tree base',10.6,-148.5,edgeHeight(10.6)],['Tree fork',11.08,-148.42,edgeHeight(10.6)+4.6],['Bench 1',15.8,roadY(15.8)+9.77,edgeHeight(15.8)+1.05],['Bench 2',19,roadY(19)+9.77,edgeHeight(19)+1.05],['Salesforce',...meta.landmarks.salesforce,330],['Transamerica',...meta.landmarks.transamerica,270]];
    for(let i=0;i<4;i++){const x=car.x+(i<2?-2.4:2.4),y=car.y+(i%2?1:-1);anchors.push(['Car '+i,x,y,roadHeight(x)]);}
    const projected=anchors.map(([name,x,y,z])=>{const p=V(x,y,z).project(camera);return {name,x:(p.x+1)/2,y:(1-p.y)/2,bearing:Math.atan2(x-cx,y-cy)*180/Math.PI};});
    const cameraDirection=camera.getWorldDirection(new T.Vector3());
    const modelBounds={left:1,right:0,top:1,bottom:0};
    carHolder.updateMatrixWorld(true);
    const contactMin=[Infinity,Infinity,Infinity,Infinity];
    carHolder.userData.carRoot.traverse(o=>{if(!o.isMesh)return;const a=o.geometry.attributes.position;for(let i=0;i<a.count;i++){
      const v=new T.Vector3().fromBufferAttribute(a,i).applyMatrix4(o.matrixWorld),p=v.clone().project(camera);
      modelBounds.left=Math.min(modelBounds.left,(p.x+1)/2);modelBounds.right=Math.max(modelBounds.right,(p.x+1)/2);modelBounds.top=Math.min(modelBounds.top,(1-p.y)/2);modelBounds.bottom=Math.max(modelBounds.bottom,(1-p.y)/2);
      const dx=v.x-car.x,dy=-v.z-car.y;
      if(Math.abs(Math.abs(dx)-1.36)<.28&&Math.abs(dy)>.68&&Math.abs(dy)<1.1){const k=(dx>0?2:0)+(dy>0?1:0);contactMin[k]=Math.min(contactMin[k],v.y-roadHeight(v.x));}
    }});
    window.sceneInfo = { houses:houses.stats, modelBounds,wheelContactGaps:contactMin, effective:{heading:T.MathUtils.radToDeg(Math.atan2(cameraDirection.x,-cameraDirection.z)),pitch:T.MathUtils.radToDeg(Math.asin(cameraDirection.y)),horizontalFov:fov,heightAboveRoad:num('camH',survey?(preset==='streetview'?2.85:2.5):1.6),nearRoofLift:num('nearRoofLift',3.0),sun:num('sun',6),env:num('env',.45),carEnv:num('carEnv',1.4)}, projected, roadSamples:[-20,0,20,50,80].map(x=>({x,y:roadY(x),z:roadHeight(x)})), geometryStats,preset, car: { ...car, z: roadZ }, camera: { x: cx, y: cy, z: camZ, verticalFov: vfov }, trees: treeData.length };
    window.sceneInfo.houses.sharedReflectionBytes=num('windowReflections',1)?4194304:0;
    r.compile(scene, camera);
    // GLTF and texture decodes have normally completed by here. Wait for any
    // remaining image requests, then fail loudly on missing offline assets.
    await new Promise(resolve => {
      const timer=setInterval(()=>{ if(managerPending===0) {clearInterval(timer);resolve();} },25);
    });
    if(assetErrors.length) throw new Error('Missing assets: '+assetErrors.join(', '));
    if(num('windowReflections',1)) {
      const cubeTarget=new T.WebGLCubeRenderTarget(256,{type:T.HalfFloatType,generateMipmaps:true,minFilter:T.LinearMipmapLinearFilter});
      const cube=new T.CubeCamera(.25,8000,cubeTarget);cube.position.copy(V(21,-164,roadZ+4.8));
      cube.update(r,scene);
      for(const mat of windowMaterials){mat.envMap=cubeTarget.texture;mat.envMapIntensity=.85;mat.color.setHex(0x2d414e);mat.metalness=.58;mat.needsUpdate=true;}
    }
    if(num('carReflections',1)) {
      const target=new T.WebGLCubeRenderTarget(512,{type:T.HalfFloatType,generateMipmaps:true,minFilter:T.LinearMipmapLinearFilter});
      const cube=new T.CubeCamera(.15,10000,target);cube.position.copy(V(car.x,car.y,roadZ+1.05));
      carHolder.visible=false;cube.update(r,scene);carHolder.visible=true;
      const env=pmrem.fromCubemap(target.texture).texture;
      for(const mat of [...carMaterials,...trafficMaterials]){mat.envMap=env;mat.envMapIntensity=num('carEnv',1.4);mat.envMapRotation?.set(0,0,0);mat.needsUpdate=true;}
    }
    if(num('ao',1)) {
      const target=new T.WebGLRenderTarget(W,H,{type:T.HalfFloatType,samples:4});
      const composer=new EffectComposer(r,target);
      composer.addPass(new RenderPass(scene,camera));
      const ao=new GTAOPass(scene,camera,W,H);ao.blendIntensity=num('aoGain',.58);
      ao.updateGtaoMaterial({radius:.4,thickness:.6,distanceExponent:2,distanceFallOff:1});
      composer.addPass(ao);
      if(num('bloom',1))composer.addPass(new UnrealBloomPass(new T.Vector2(W,H),.009,.25,1.75));
      composer.addPass(new OutputPass());
      const film=new ShaderPass({uniforms:{tDiffuse:{value:null},grain:{value:num('grain',.0022)}},
        vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
        fragmentShader:`uniform sampler2D tDiffuse;uniform float grain;varying vec2 vUv;
          void main(){vec3 c=texture2D(tDiffuse,vUv).rgb;float lum=dot(c,vec3(.299,.587,.114));c=mix(vec3(lum),c,1.045);c=(c-.45)*1.035+.45;
          float noise=fract(sin(dot(gl_FragCoord.xy,vec2(12.9898,78.233)))*43758.5453)-.5;
          c+=noise*grain;gl_FragColor=vec4(clamp(c,0.,1.),1.);}`});
      composer.addPass(film);composer.render();
    }else r.render(scene, camera);
    window.sceneInfo.gpuResources={geometries:r.info.memory.geometries,textures:r.info.memory.textures};
    if(num('debug',0)) {
      const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');ctx.drawImage(r.domElement,0,0);
      ctx.font='20px sans-serif';ctx.lineWidth=2;
      ctx.strokeStyle='#ff8844';ctx.beginPath();for(let x=-12;x<=35;x+=.5){const p=V(x,roadY(x)+5.5,edgeHeight(x)).project(camera);const xx=(p.x+1)*W/2,yy=(1-p.y)*H/2;if(x===-12)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);}ctx.stroke();
      for(let bearing=0;bearing<90;bearing+=5){const a=rad(bearing),p=V(cx+Math.sin(a)*1000,cy+Math.cos(a)*1000,camZ).project(camera),xx=(p.x+1)*W/2;if(xx<0||xx>W)continue;ctx.strokeStyle='#55eaff';ctx.fillStyle='#55eaff';ctx.beginPath();ctx.moveTo(xx,28);ctx.lineTo(xx,48);ctx.stroke();ctx.fillText(bearing+'°',xx+4,25);}
      projected.forEach(p=>{ctx.fillStyle='#ffdd55';ctx.strokeStyle='#171717';const x=p.x*W,y=p.y*H;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();ctx.strokeText(p.name,x+9,y-8);ctx.fillText(p.name,x+9,y-8);});
      window.png=c.toDataURL('image/png');
    } else window.png = r.domElement.toDataURL('image/png');
    window.done = true;
  }
  main().catch((e) => {
    window.error = String(e && e.stack ? e.stack : e);
    window.done = true;
  });
</script>
</body>
